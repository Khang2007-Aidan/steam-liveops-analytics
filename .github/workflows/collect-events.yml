name: Thu thap gia va tin tuc

on:
  schedule:
    # 1 lan moi ngay, lech gio voi workflow kia
    - cron: "43 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: steam-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cai thu vien
        run: pip install -r requirements.txt

      - name: Chay script
        run: python scripts/collect_events.py

      - name: Luu du lieu vao repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet && echo "Khong co du lieu moi" && exit 0
          git commit -m "Gia va tin tuc $(date -u +'%Y-%m-%d')"
          git pull --rebase
          git push
